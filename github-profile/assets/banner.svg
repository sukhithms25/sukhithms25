<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" fill="none">
  <style>
    .title { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-weight: bold; font-size: 14px; fill: #00f0ff; }
    .window-header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .window-body { fill: #0b0e14; stroke: #30363d; stroke-width: 1; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
    .terminal-text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #c9d1d9; }
    .accent { fill: #00f0ff; }
    .accent-dim { fill: #30363d; }
    .label { fill: #58a6ff; font-weight: bold; }
  </style>
  
  <!-- Outer Window -->
  <rect x="5" y="5" width="790" height="190" rx="8" class="window-body" />
  
  <!-- Window Title Bar -->
  <path d="M5 13C5 8.58172 8.58172 5 13 5H787C791.418 5 795 8.58172 795 13V35H5V13Z" class="window-header" />
  
  <!-- Window Buttons -->
  <circle cx="25" cy="20" r="6" class="btn-red" />
  <circle cx="45" cy="20" r="6" class="btn-yellow" />
  <circle cx="65" cy="20" r="6" class="btn-green" />
  
  <!-- Header Title -->
  <text x="400" y="25" text-anchor="middle" class="title">[SUKHITHMS25 // DEVELOPER PROFILE]</text>
  
  <!-- Terminal Content -->
  <text x="30" y="62" class="terminal-text"><tspan class="accent">sukhithms25@github:~$</tspan> whoami</text>
  
  <!-- Left Side: ASCII Logo -->
  <text x="30" y="88" class="terminal-text" font-size="11" fill="#00f0ff">
    <tspan x="30" dy="0">  /\___/\  </tspan>
    <tspan x="30" dy="15"> ( o o ) </tspan>
    <tspan x="30" dy="15"> ( =^= ) </tspan>
    <tspan x="30" dy="15"> (_____) </tspan>
  </text>
  
  <!-- Right Side: System Info -->
  <text x="160" y="88" class="terminal-text" font-size="12">
    <tspan x="160" dy="0"><tspan class="label">Name</tspan>:     Sukhith M S</tspan>
    <tspan x="160" dy="16"><tspan class="label">Role</tspan>:     Computer Science Engineering Student</tspan>
    <tspan x="160" dy="16"><tspan class="label">Focus</tspan>:    Full-Stack Development • AI Systems</tspan>
    <tspan x="160" dy="16"><tspan class="label">Building</tspan>: Intelligent Software &amp; Developer Tools</tspan>
    <tspan x="160" dy="16"><tspan class="label">Status</tspan>:   Open to Opportunities</tspan>
  </text>
  
  <!-- Terminal Bottom bar decoration -->
  <rect x="15" y="178" width="770" height="2" class="accent-dim" />
  <circle cx="780" cy="179" r="3" class="accent" />
</svg>
